<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" /><title>strix sample</title>
        <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1.0,maximum-scale=1.0,minimal-ui, viewport-fit=cover">
        <style>
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                background: #000;
                overscroll-behavior: none;
                -webkit-overflow-scrolling: auto;
            }

            body {
                position: relative;
                overflow: hidden;
            }

            .canvas-container {
                position: fixed;
                inset: 0;
                width: 100%;
                height: 100%;
                z-index: 1;
            }

            #view {
                display: block;
                width: 100%;
                height: 100%;
                outline: none;
            }
        </style>
    </head>

    <body>
        <div class="canvas-container">
            <canvas id="view"></canvas>
        </div>

        <script type="module" src="./main.ts"></script>
    </body>
</html>
